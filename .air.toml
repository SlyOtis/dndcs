root = "."
tmp_dir = "bin"

[build]
  cmd = "go build -ldflags '-X github.com/SlyOtis/dndcs/internal/version.Version=${SERVER_VERSION:-dev}' -o ./bin/debug ./cmd"
  bin = "./bin/debug"
  include_ext = ["go"]
  exclude_dir = ["bin", "tmp", "database", "web", "node_modules", ".git", ".claude", ".idea", "media", "reference"]
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"

[screen]
  clear_on_rebuild = true
